name: Publish academic website

on:
  push:
    branches: [main, content/recruiter-polish]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout site source
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Set up Node.js for Pagefind
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Jekyll website
        run: bundle exec jekyll build
      - name: Validate bilingual routes and language redirects
        run: |
          python3 scripts/check_bilingual_site.py _site
          node scripts/check_language_redirect.cjs
      - name: Validate built page SEO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          class Tags(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = []
              def handle_starttag(self, name, attrs):
                  if name in ('meta', 'link'):
                      self.tags.append((name, dict(attrs)))
          routes = {'home':'index.html','teaching':'ensino/index.html',
                    'extension':'extensao/index.html','research':'pesquisa/index.html'}
          english = {'home':'en/index.html','teaching':'en/teaching/index.html',
                     'extension':'en/extension/index.html','research':'en/research/index.html'}
          for lang, mapping in [('pt',routes),('en',english)]:
              for name, out in mapping.items():
                  source = Path('_pages') / lang / (name + '.md')
                  desc = re.search(r'^description: "([^"]+)"$', source.read_text(), re.M)
                  assert desc, source
                  parser = Tags()
                  parser.feed((Path('_site') / out).read_text())
                  descriptions = [v.get('content') for tag,v in parser.tags if tag=='meta' and v.get('name')=='description']
                  canonical = [v.get('href') for tag,v in parser.tags if tag=='link' and v.get('rel')=='canonical']
                  alternates = {v.get('hreflang') for tag,v in parser.tags if tag=='link' and v.get('rel')=='alternate'}
                  assert descriptions == [desc.group(1)], (source,descriptions)
                  assert len(canonical)==1 and canonical[0].startswith('https://'), out
                  assert {'pt-BR','en-US'} <= alternates, (out, alternates)
                  print(out, 'description/canonical/hreflang OK')
          PY
      - name: Validate deployment under a subpath
        run: |
          bundle exec jekyll build --baseurl /project --destination /tmp/site-subpath
          python3 scripts/check_bilingual_site.py /tmp/site-subpath /project
      - name: Build Pagefind search index
        run: npx --yes pagefind@1.5.2 --site _site
      - name: Install browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/site-browser-check" --no-package-lock --no-save playwright@1.58.2
          node "$RUNNER_TEMP/site-browser-check/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check navigation in Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/site-browser-check/node_modules/playwright
        run: |
          bundle exec jekyll serve --detach --host 127.0.0.1 --port 4000 --skip-initial-build
          node scripts/check_navigation.cjs
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
