name: Publish academic website

on:
  push:
    branches: [main, content/recruiter-polish]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout site source
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Set up Node.js for Pagefind
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Jekyll website
        run: bundle exec jekyll build
      - name: Validate bilingual routes and language redirects
        run: |
          python3 scripts/check_bilingual_site.py _site
          node scripts/check_language_redirect.cjs
      - name: Validate generated page SEO metadata
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          routes = {
              "_pages/pt/home.md": "_site/index.html",
              "_pages/en/home.md": "_site/en/index.html",
              "_pages/pt/teaching.md": "_site/ensino/index.html",
              "_pages/en/teaching.md": "_site/en/teaching/index.html",
              "_pages/pt/extension.md": "_site/extensao/index.html",
              "_pages/en/extension.md": "_site/en/extension/index.html",
              "_pages/pt/research.md": "_site/pesquisa/index.html",
              "_pages/en/research.md": "_site/en/research/index.html",
          }

          class HeadTags(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = []

              def handle_starttag(self, tag, attrs):
                  if tag in ("meta", "link"):
                      self.tags.append((tag, dict(attrs)))

          for source, output in routes.items():
              match = re.search(r'^description: "([^"]+)"        run: |
          bundle exec jekyll build --baseurl /project --destination /tmp/site-subpath
          python3 scripts/check_bilingual_site.py /tmp/site-subpath /project
      - name: Build Pagefind search index
        run: npx --yes pagefind@1.5.2 --site _site
      - name: Install browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/site-browser-check" --no-package-lock --no-save playwright@1.58.2
          node "$RUNNER_TEMP/site-browser-check/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check navigation in Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/site-browser-check/node_modules/playwright
        run: |
          bundle exec jekyll serve --detach --host 127.0.0.1 --port 4000 --skip-initial-build
          node scripts/check_navigation.cjs
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
, Path(source).read_text(), re.M)
              assert match, f"Missing description in {source}"
              tags = HeadTags()
              tags.feed(Path(output).read_text())
              descriptions = [data.get("content") for kind, data in tags.tags
                              if kind == "meta" and data.get("name") == "description"]
              canonical = [data.get("href") for kind, data in tags.tags
                           if kind == "link" and data.get("rel") == "canonical"]
              languages = {data.get("hreflang") for kind, data in tags.tags
                           if kind == "link" and data.get("rel") == "alternate"}
              assert descriptions == [match.group(1)], f"{output}: {descriptions!r}"
              assert len(canonical) == 1 and canonical[0].startswith("https://"), output
              assert {"pt-BR", "en-US"} <= languages, f"{output}: {languages!r}"
              print(f"{output}: description, canonical and hreflang verified")
          PY
      - name: Validate deployment under a subpath
        run: |
          bundle exec jekyll build --baseurl /project --destination /tmp/site-subpath
          python3 scripts/check_bilingual_site.py /tmp/site-subpath /project
      - name: Build Pagefind search index
        run: npx --yes pagefind@1.5.2 --site _site
      - name: Install browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/site-browser-check" --no-package-lock --no-save playwright@1.58.2
          node "$RUNNER_TEMP/site-browser-check/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check navigation in Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/site-browser-check/node_modules/playwright
        run: |
          bundle exec jekyll serve --detach --host 127.0.0.1 --port 4000 --skip-initial-build
          node scripts/check_navigation.cjs
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
