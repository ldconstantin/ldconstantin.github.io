{% assign sections = include.page_content | split: '<h2' %}
<nav id="site-nav" class="site-nav local-page-nav" aria-label="{{ ui.sections }} {{ page.title | escape }}"{% if sections.size <= 1 %} hidden{% endif %}>
  {% if sections.size > 1 %}
    <h2 class="nav-category">{{ ui.on_this_page }}</h2>
    {% include components/local_nav_items.html html=include.page_content level=2 %}
  {% endif %}
</nav>
