<div id="main-header" class="main-header">
  <nav class="academic-nav" aria-label="Menu principal">
    <ul class="academic-nav-list">
      {% for item in site.data.navigation.main %}
        <li><a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% elsif page.parent == item.title %}aria-current="location"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
  <pagefind-modal-trigger class="site-search-trigger" compact hide-shortcut placeholder="Buscar no site" aria-label="Buscar no site">
    <button class="site-search-fallback" type="button" aria-label="Busca indisponível nesta prévia" title="Busca indisponível nesta prévia" disabled>
      <svg viewBox="0 0 24 24" width="19.8" height="19.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="10.75" cy="10.75" r="7"/><path d="m16 16 5 5"/>
      </svg>
    </button>
  </pagefind-modal-trigger>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Mudar o tema de cores" aria-pressed="false" hidden>
    <svg class="theme-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
    </svg>
    <svg class="theme-moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/>
    </svg>
  </button>
</div>
